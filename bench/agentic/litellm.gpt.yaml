# LiteLLM config -- bridges the Claude Code harness to the OpenAI API.
#
# ASCII ONLY. PyYAML reads this file with the process default encoding; on a Japanese
# Windows that is cp932, and any non-ASCII byte here kills the proxy at startup with
# UnicodeDecodeError (hit for real on 2026-07-12). Keep every comment in ASCII.
# The Japanese rationale lives in gpt-proxy.ps1 and bench/agentic/README.md.
#
# The API key comes from the OPENAI_API_KEY environment variable. Never write it here.

model_list:
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true   # drop Anthropic-only params instead of erroring out

general_settings:
  master_key: fablet-local   # dummy; the proxy listens on 127.0.0.1 only
